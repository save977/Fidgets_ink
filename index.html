<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Suit Character</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 16px;
      margin-bottom: 24px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 18px 55px #0008;
    }
  </style>
</head>

<body>
  <main>
    <h1>Minecraft Suit Character</h1>

    <p>
      Dark blue suit, dark brown hair, green eyes,
      red tie, white shirt, and black shoes.
    </p>

    <img
      src="a_clean_stylized_high_resolution_minecraft_insp.png"
      alt="Minecraft character wearing a dark blue suit and red tie"
    >
  </main>
</body>
</html>
