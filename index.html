<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft SkyBlock</title>

<style>
* {
  box-sizing: border-box;
  image-rendering: pixelated;
}

body {
  margin: 0;
  overflow-x: hidden;
  background: #111a2b;
  font-family: monospace;
  color: white;
}

.scene {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(
    #4b9cde 0%,
    #a9e0f7 48%,
    #64b6e8 70%,
    #315b87 100%
  );
}

.sun {
  position: absolute;
  width: 90px;
  height: 90px;
  background: #fff6b0;
  top: 9%;
  right: 14%;
  box-shadow: 0 0 65px #fff6a0;
}

.cloud {
  position: absolute;
  height: 22px;
  width: 125px;
  background: #fff;
  opacity: .85;
  box-shadow: 25px -20px #fff, 55px -10px #fff;
}

.cloud.one {
  top: 17%;
  left: 8%;
}

.cloud.two {
  top: 29%;
  right: 12%;
  transform: scale(.7);
}

.island {
  position: absolute;
  bottom: 0;
  height: 28%;
  width: 120%;
  left: -10%;
  background: #4a9a43;
  border-top: 18px solid #7acb54;
  box-shadow: 0 45px #795438, 0 90px #49392e;
  transform: perspective(300px) rotateX(5deg);
}

.island:before {
  content: "";
  position: absolute;
  height: 80px;
  width: 100%;
  top: 18px;
  background: repeating-linear-gradient(
    90deg,
    transparent 0 70px,
    #0000000c 70px 90px
  );
}

.waterfall {
  position: absolute;
  width: 35px;
  height: 160px;
  background: repeating-linear-gradient(
    0deg, #56d6f5 0 15px, #a2efff 15px 25px
  );
  bottom: 13%;
  left: 18%;
}

.waterfall.two {
  left: auto;
  right: 17%;
  height: 115px;
}

.tree {
  position: absolute;
  bottom: 29%;
  left: 12%;
  width: 25px;
  height: 95px;
  background: #79502f;
}

.tree:before {
  content: "";
  position: absolute;
  width: 100px;
  height: 75px;
  background: #287d3c;
  left: -38px;
  top: -55px;
  box-shadow: 15px -25px #389d49, -15px 12px #43ad4d;
}

.tree.right {
  left: auto;
  right: 13%;
  transform: scale(.8);
}

.title {
  position: absolute;
  top: 5%;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(24px, 5vw, 54px);
  font-weight: 900;
  color: #fff;
  text-shadow: 4px 4px #263b5a, 7px 7px #18273d;
  letter-spacing: 3px;
}

.subtitle {
  position: absolute;
  top: calc(5% + 60px);
  width: 100%;
  text-align: center;
  color: #fff6a6;
  font-weight: bold;
  text-shadow: 2px 2px #263b5a;
  letter-spacing: 4px;
}

.character {
  position: relative;
  z-index: 5;
  width: 200px;
  height: 400px;
  margin-top: 35px;
  filter: drop-shadow(12px 14px 0 #1a2b3a66);
}

/* BLOCK HEAD */
.head {
  position: absolute;
  top: 0;
  left: 40px;
  width: 120px;
  height: 120px;
  background: #e6b38c;
  box-shadow: inset -12px -8px #c9916b;
  z-index: 4;
}

/* HAIR */
.hair {
  position: absolute;
  left: 40px;
  top: -8px;
  width: 120px;
  height: 40px;
  background: #493024;
  z-index: 6;
}

.hair:before {
  content: "";
  position: absolute;
  left: -4px;
  top: 20px;
  width: 25px;
  height: 40px;
  background: #493024;
  box-shadow: 25px 10px #493024, 55px 2px #493024;
}

.hair:after {
  content: "";
  position: absolute;
  right: -3px;
  top: 24px;
  width: 20px;
  height: 42px;
  background: #493024;
}

/* GREEN EYES */
.eye {
  position: absolute;
  top: 57px;
  left: 16px;
  width: 25px;
  height: 13px;
  background: #fff;
  box-shadow: 65px 0 #fff;
}

.eye:after {
  content: "";
  position: absolute;
  left: 9px;
  width: 12px;
  height: 13px;
  background: #32d35b;
  box-shadow: 65px 0 #32d35b;
}

.nose {
  position: absolute;
  top: 72px;
  left: 55px;
  width: 12px;
  height: 15px;
  background: #c9916b;
}

.mouth {
  position: absolute;
  top: 94px;
  left: 42px;
  width: 38px;
  height: 7px;
  background: #8b4539;
}

/* WHITE SHIRT AND NAVY SUIT */
.torso {
  position: absolute;
  top: 120px;
  left: 35px;
  width: 130px;
  height: 145px;
  background: #142e57;
  box-shadow: inset -15px 0 #0c2141;
}

.shirt {
  position: absolute;
  top: 0;
  left: 43px;
  width: 43px;
  height: 125px;
  background: #fff;
  clip-path: polygon(0 0, 100% 0, 70% 100%, 30% 100%);
}

.tie {
  position: absolute;
  top: 8px;
  left: 57px;
  width: 19px;
  height: 95px;
  background: #d92535;
  clip-path: polygon(20% 0, 80% 0, 100% 18%, 60% 100%, 0 18%);
}

.tie:before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 17px;
  background: #a91024;
}

.lapel {
  position: absolute;
  top: 0;
  left: 22px;
  width: 30px;
  height: 75px;
  background: #244573;
  clip-path: polygon(0 0, 100% 0, 100% 100%);
}

.lapel.right {
  left: 78px;
  transform: scaleX(-1);
}

/* SUIT ARMS */
.arm {
  position: absolute;
  top: 125px;
  width: 35px;
  height: 115px;
  background: #18375f;
}

.arm.left {
  left: 0;
}

.arm.right {
  right: 0;
  background: #102748;
}

.hand {
  position: absolute;
  bottom: -22px;
  left: 3px;
  width: 29px;
  height: 25px;
  background: #e6b38c;
}

/* TROUSERS */
.legs {
  position: absolute;
  top: 265px;
  left: 42px;
  width: 116px;
  height: 100px;
  background: #172d4c;
}

.legs:after {
  content: "";
  position: absolute;
  left: 55px;
  width: 7px;
  height: 100%;
  background: #0d203a;
}

/* BLACK SHOES */
.shoe {
  position: absolute;
  top: 355px;
  left: 32px;
  width: 63px;
  height: 28px;
  background: #101116;
  box-shadow: inset 0 -7px #292a31;
}

.shoe.right {
  left: 105px;
}

.platform {
  position: absolute;
  bottom: 16%;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  height: 35px;
  background: #8d939c;
  border-top: 10px solid #c2c9d0;
  box-shadow: 0 20px #626c79;
}

/* GAME HUD */
.hud {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: min(96%, 560px);
  z-index: 10;
  text-align: center;
  text-shadow: 2px 2px #000;
}

.stats {
  font-size: 18px;
  margin-bottom: 6px;
  letter-spacing: 3px;
}

.xp {
  width: 100%;
  height: 7px;
  background: #222;
  border: 1px solid #111;
  margin-bottom: 5px;
}

.xp span {
  display: block;
  width: 72%;
  height: 100%;
  background: #65ef35;
}

.level {
  position: absolute;
  right: 8%;
  top: -30px;
  color: #80ff51;
  font-weight: bold;
  font-size: 20px;
}

.hotbar {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 3px;
  padding: 5px;
  background: #25252bd9;
  border: 3px solid #777984;
  outline: 2px solid #222;
}

.slot {
  aspect-ratio: 1;
  background: #444650;
  border: 2px solid #777984;
  box-shadow: inset 2px 2px #292a31;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(17px, 4vw, 29px);
  position: relative;
}

.slot.selected {
  border: 3px solid white;
  background: #777984;
}

.slot small {
  position: absolute;
  bottom: 1px;
  right: 3px;
  font-size: 10px;
  color: white;
}

@media (max-width: 500px) {
  .character {
    transform: scale(.78);
  }

  .platform {
    width: 250px;
  }

  .title {
    top: 8%;
  }

  .subtitle {
    top: calc(8% + 42px);
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="sun"></div>
  <div class="cloud one"></div>
  <div class="cloud two"></div>

  <div class="title">HYPIXEL SKYBLOCK</div>
  <div class="subtitle">ADVENTURE AWAITS</div>

  <div class="island"></div>
  <div class="waterfall"></div>
  <div class="waterfall two"></div>
  <div class="tree"></div>
  <div class="tree right"></div>

  <div class="platform"></div>

  <div class="character">

    <div class="head">
      <div class="eye"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </div>

    <div class="hair"></div>

    <div class="torso">
      <div class="shirt"></div>
      <div class="tie"></div>
      <div class="lapel"></div>
      <div class="lapel right"></div>
    </div>

    <div class="arm left">
      <div class="hand"></div>
    </div>

    <div class="arm right">
      <div class="hand"></div>
    </div>

    <div class="legs"></div>
    <div class="shoe"></div>
    <div class="shoe right"></div>

  </div>

  <div class="hud">
    <div class="stats">❤ ❤ ❤ ❤ ❤</div>
    <div class="level">281</div>
    <div class="xp"><span></span></div>

    <div class="hotbar">
      <div class="slot selected">⚔️</div>
      <div class="slot">🗡️</div>
      <div class="slot">✨</div>
      <div class="slot">🏹</div>
      <div class="slot">🪄</div>
      <div class="slot">💎</div>
      <div class="slot">🍎</div>
      <div class="slot">🧪</div>
      <div class="slot">🟩</div>
    </div>
  </div>

</div>

</body>
</html>
